name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Firestore Emulator の実行に Java ランタイムが必要。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (pure libs)
        run: npm test

      # firebase-tools が emulators:exec を提供。初回は emulator JAR をダウンロードするので
      # 数十秒余分にかかるが、PR 1 回あたりの追加コストは許容範囲。
      - name: Firestore Rules tests
        run: npm run test:rules

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Functions build (typecheck)
        run: npm run build
        working-directory: functions

      # E2E: Auth/Firestore/Storage エミュレータ + 実ブラウザで
      # 「初回登録 → 記録保存 → 一覧反映」のゴールデンパスを検証。
      # 依存更新 PR (Dependabot) をレビューなしでマージできる根拠はこれ。
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E golden path
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
