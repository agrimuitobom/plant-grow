name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 念のため: main に直 push されたケースでも、壊れたコードがデプロイされないよう
      # 単体テストを safety net として入れる。typecheck は後段の `npm run build` が
      # 内部で `tsc --noEmit` してくれるのでここでは重複させない。
      # 重い Rules テストは test.yml で PR 段階で実行済みなのでここでは省略。
      - name: Unit tests
        run: npm test

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # 任意。Secrets に登録されていなければ空文字 → クライアント側の Sentry 初期化が no-op。
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLANT_RESEARCH_B106B }}
          channelId: live
          projectId: plant-research-b106b

      - name: Deploy Firestore & Storage rules
        uses: w9jds/firebase-action@v13.23.1
        with:
          args: deploy --only firestore:rules,storage --project plant-research-b106b
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLANT_RESEARCH_B106B }}

      # Cloud Functions のデプロイ。
      # - functions/package.json と src/ の変更が含まれていない時もこのステップは走るが、
      #   firebase CLI 側で差分なしの場合は no-op で終わるので無害。
      # - --force は CI 非対話モード用 (関数削除などで confirm が出るのを避ける)。
      # - firebase.json の predeploy フック (`npm --prefix "$RESOURCE_DIR" run build`) が
      #   走るので、ここでは npm ci で依存だけ用意すれば OK。
      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Deploy Cloud Functions
        uses: w9jds/firebase-action@v13.23.1
        with:
          args: deploy --only functions --project plant-research-b106b --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLANT_RESEARCH_B106B }}
